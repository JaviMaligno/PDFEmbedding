[project]
name = "pdf-embedding"
version = "0.1.0"
description = "PDF document search service with hybrid semantic search"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.3",
    "starlette>=1.3.1,<2",
    "anyio>=4.14.2,<5",
    "certifi>=2026.10.19",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.25",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",
    "celery[redis]>=5.3.0",
    "redis>=5.0.0",
    "httpx>=0.26.0",
    "pymupdf>=1.23.0,<2",
    "pdf2image>=1.17.0",
    "pillow>=13.0.0",
    "tiktoken>=0.5.0",
    "openai>=1.10.0",
    "google-generativeai>=0.3.0",
    "pgvector>=0.2.0",
    "prometheus-client>=0.19.0",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["app"]
